<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maison de Build — Legal</title>
  <style>
    :root { --ink:#111; --muted:#666; --line:#e5e5e5; --bg:#fafafa; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink); background:var(--bg); margin:0; line-height:1.6; }
    .wrap { max-width:760px; margin:0 auto; padding:48px 20px; }
    h1 { font-size:1.8rem; letter-spacing:.02em; margin:0 0 4px; }
    .tag { color:var(--muted); margin:0 0 32px; }
    a.card { display:block; text-decoration:none; color:var(--ink); background:#fff;
      border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin:14px 0; }
    a.card:hover { border-color:#bbb; }
    a.card b { display:block; font-size:1.1rem; }
    a.card span { color:var(--muted); font-size:.95rem; }
    footer { color:var(--muted); font-size:.85rem; margin-top:40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Maison de Build</h1>
    <p class="tag">A house, not a gym. — Legal &amp; support</p>
    <a class="card" href="./privacy-policy.html"><b>Privacy Policy</b><span>How we collect, use, and protect your data.</span></a>
    <a class="card" href="./terms.html"><b>Terms &amp; Conditions</b><span>The terms that govern your membership and use of the app.</span></a>
    <a class="card" href="./support.html"><b>Support</b><span>Get help, contact us, and request account deletion.</span></a>
    <footer>© 2026 Maison de Build. All rights reserved.</footer>
  </div>
</body>
</html>
